name: Build Windows EXE

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install PyQt5 requests PySocks pyinstaller

      - name: Build EXE
        working-directory: windows_client
        run: |
          pyinstaller --onefile --noconsole --name "VPNClient" --clean vpn_client.py

      - name: Copy config
        working-directory: windows_client
        run: |
          copy config.py dist\config.py

      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: VPNClient
          path: |
            windows_client/dist/VPNClient.exe
            windows_client/dist/config.py
