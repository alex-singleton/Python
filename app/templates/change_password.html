{% extends "base.html" %}
{% block title %}Parol Dəyiş - Firewall{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card shadow">
            <div class="card-header">
                <h5><i class="bi bi-key"></i> Parol Dəyişdir</h5>
            </div>
            <div class="card-body">
                <form method="POST">
                    <div class="mb-3">
                        <label for="current_password" class="form-label">Cari Parol</label>
                        <input type="password" class="form-control" id="current_password" 
                               name="current_password" required>
                    </div>
                    <div class="mb-3">
                        <label for="new_password" class="form-label">Yeni Parol</label>
                        <input type="password" class="form-control" id="new_password" 
                               name="new_password" required minlength="6">
                    </div>
                    <div class="mb-3">
                        <label for="confirm_password" class="form-label">Yeni Parol (Təkrar)</label>
                        <input type="password" class="form-control" id="confirm_password" 
                               name="confirm_password" required minlength="6">
                    </div>
                    <div class="d-flex gap-2">
                        <button type="submit" class="btn btn-primary">
                            <i class="bi bi-check-lg"></i> Yadda Saxla
                        </button>
                        <a href="{{ url_for('dashboard.index') }}" class="btn btn-secondary">
                            <i class="bi bi-x-lg"></i> Ləğv et
                        </a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
